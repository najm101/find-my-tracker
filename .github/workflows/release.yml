name: Publish

# Every push to main publishes ghcr.io/<owner>/find-my-tracker:edge and :sha-<short>.
# When the version in server/pyproject.toml has no v<version> tag yet, the same run also
# publishes :<version>, :<major>.<minor> and :latest, then tags the commit and creates a
# GitHub Release. To release: bump that version and push.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' server/pyproject.toml | head -n1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::server/pyproject.toml version '$version' is not X.Y.Z"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            release=false
            echo "v$version is already released: publishing :edge only"
          else
            release=true
            echo "v$version is new: releasing it"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  image:
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the commit and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          ## Docker image

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Or use \`image: ${IMAGE}:latest\` in \`compose.yaml\`. Images are built for \`linux/amd64\` and \`linux/arm64\`.

          > **Beta.** This uses Apple's private Find My APIs. Read the disclaimer in the README before use: your Apple account is your responsibility.
          NOTES
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file notes.md --generate-notes
