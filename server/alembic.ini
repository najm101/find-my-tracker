# For developers generating new migrations:
#   uv run alembic revision --autogenerate -m "..."
# The app itself applies migrations on startup (core/migrate.py) and does not read this file.
[alembic]
script_location = src/find_my_tracker/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite+pysqlite:///../data/dev/tracker.db
